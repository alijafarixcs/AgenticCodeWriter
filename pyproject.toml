[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-agent"
version = "0.1.0"
description = "Iterative AI-powered Python code generator and reviewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3,<2",
    "openai>=1.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
ai-code-agent = "ai_code_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

